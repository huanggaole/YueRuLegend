<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="css/game.css">
        <title>debug</title>
    </head>
    <body style="background-color: black">
        <pre id="log" style="position:fixed;left:-9999px;top:0"></pre>
        <script>
            const LOG = [];
            function put(s) { LOG.push(String(s)); document.getElementById("log").textContent = LOG.join("\n"); }
            window.addEventListener("error", e => put("ERROR: " + e.message + " @" + e.filename + ":" + e.lineno));
            window.addEventListener("unhandledrejection", e => put("REJECT: " + e.reason));
            const _ce = console.error; console.error = function (...a) { put("console.error: " + a.map(String).join(" ").slice(0, 300)); _ce.apply(console, a); };
        </script>
        <script type="text/javascript" src="js/main.js"></script>
        <script>
            let ticks = 0;
            const iv = setInterval(function () {
                ticks++;
                try {
                    const sc = SceneManager._scene;
                    let line = "t" + ticks + " scene=" + (sc && sc.constructor.name);
                    if (sc && sc._actorCommandWindow) {
                        const w = sc._actorCommandWindow;
                        const btns = w._buttonSprites || [];
                        const bi = btns.map(s => (s.visible ? "V" : "h") + (s.alpha).toFixed(2) +
                            "/" + (s.bitmap ? s.bitmap.width + "x" + s.bitmap.height + (s.bitmap.isReady() ? "R" : "NR") : "no") +
                            "@" + s.x + "," + s.y).join(" ");
                        line += " ACW vis=" + w.visible + " act=" + w.active + " opa=" + w.opacity +
                            " alpha=" + w.alpha + " open=" + w.openness +
                            " rect=" + w.x + "," + w.y + "," + w.width + "," + w.height +
                            " kids=" + w.children.length + " btns=[" + bi + "]";
                    }
                    put(line);
                } catch (e) { put("t" + ticks + " THROW " + e.message); }
                if (ticks >= 25) { clearInterval(iv); put("---END---"); }
            }, 800);
        </script>
    </body>
</html>
